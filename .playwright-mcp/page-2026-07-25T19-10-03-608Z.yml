    - heading "How to get a job as a software developer in big 2026" [level=1] [ref=e12]
    - paragraph [ref=e13]: "Two months of job hunting, four offers, and the roadmap that came out of it: the 2026 pipeline, what to actually practice, and why your AI workflow is now part of the interview."

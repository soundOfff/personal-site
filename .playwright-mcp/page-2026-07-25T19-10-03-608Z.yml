    - heading "System design and CEO talks" [level=2] [ref=e151]
    - paragraph [ref=e152]: "Honesty first: this is the round that knocked me out of two product companies, so read this section as notes from the guy who failed it, not the guy who passed it."
    - paragraph [ref=e153]: "One clarification so you don’t repeat my typo: the round is called system design. Architecture, APIs, database choices, scaling, trade-offs. A design system is a different thing entirely, the frontend artifact with component libraries and design tokens, and some frontend loops test that separately."
    - paragraph [ref=e154]: "What I can recommend: research the team you’d be joining and what they’re building, so the conversation can go toward the systems they actually run instead of a generic URL shortener."
    - paragraph [ref=e155]:
      - text: For learning the material itself, I recommend Matt Pocock’s /teach skill (
      - code [ref=e156]: npx skills add mattpocock/skills --skill=teach
      - text: ). It turns a directory into a study workspace your coding agent teaches from, pulling cited sources instead of answering from model memory.
    - paragraph [ref=e157]: The final meeting with the manager or CEO doubles as the behavioural round, so your HR-screen script gets a second performance.
    - heading "The AI workflow question" [level=2] [ref=e158]
    - paragraph [ref=e159]: In 2026 your AI workflow is part of the interview. Canva replaced its computer-science-fundamentals round with an AI-assisted coding interview. Meta added an AI-enabled round, Google is piloting one, and AI-native startups like Sierra hand you agent tooling and watch what you do with it.
    - paragraph [ref=e160]: "What they evaluate is not the size of your rig. It’s judgment: when you rejected AI output, how you knew it was wrong, how you validate what your agents produce. “I ask Claude and turn on plan mode” dies at the first follow-up question. A practiced setup, rules files, agents, a repeatable workflow you can rebuild in front of someone, helps you demo that judgment convincingly. But the setup is the prop; the review habits are the act."
    - figure [ref=e161]:
      - 'img "Flow diagram: your prompt goes to the agent, which produces output. The output drops into your review, which either sends it back to the prompt, labeled reject refine again, or ships it." [ref=e162]'
      - paragraph [ref=e164]: your prompt
      - paragraph [ref=e166]: the agent
      - paragraph [ref=e168]: its output
      - paragraph [ref=e170]: your review
      - paragraph [ref=e172]: reject, refine, again
      - paragraph [ref=e174]: ship
      - paragraph [ref=e176]: The loop they actually grade. The rig is scenery; the amber box is the act.
    - paragraph [ref=e177]: "One caveat before you show up with your rig: some companies still ban AI in interviews entirely, Amazon and Goldman among them. Check before you plug in."
    - heading "The open questions" [level=2] [ref=e178]
    - paragraph [ref=e179]: "Things I’m still researching, and I owe each of them its own post:"
    - list [ref=e180]:
      - listitem [ref=e181]: Where do you actually find the jobs, and is any tool useful for it?
      - listitem [ref=e182]: What should you read for technical interviews?
      - listitem [ref=e183]: How is AI changing the process from the company’s side?
      - listitem [ref=e184]: Startups vs mid-size companies.
      - listitem [ref=e185]: "Is LeetCode dead? (I just told you to grind it, so: not yet.)"
      - listitem [ref=e186]: System design book recommendations.
      - listitem [ref=e187]: What does the survivor profile look like?
    - paragraph [ref=e188]: If you have answers to any of these, my inbox is open. Meanwhile I’ll be in some HR screen, improvising from my script.

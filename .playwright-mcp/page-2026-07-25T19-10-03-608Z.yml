    - list [ref=e137]:
      - listitem [ref=e138]: Hash tables -> must know. No negotiation on this one.
      - listitem [ref=e139]: Binary trees -> good to know, and the exercises are genuinely fun.
      - listitem [ref=e140]: B-trees -> good to know conceptually. Nearly every mainstream database (Postgres, MySQL, SQLite, MongoDB) uses the B-tree family (usually B+ trees) for its indexes, and often for the table data itself. Nobody will ask you to implement one; they’ll ask why an index makes a query fast, and when it doesn’t help.
      - listitem [ref=e141]: Tries -> autocomplete. Elasticsearch’s completion suggester runs on trie-shaped automata, so this one is not just interview folklore.
      - listitem [ref=e142]: "Probabilistic structures -> Bloom filters (RocksDB and Cassandra use them to skip files that can’t contain your key), HyperLogLog, count-min sketch. Honesty: outside big tech these live in system design conversations, not coding rounds."
    - paragraph [ref=e143]: "And at minimum these algorithms:"
    - list [ref=e144]:
      - listitem [ref=e145]: Recursion.
      - listitem [ref=e146]: DFS and BFS.
      - listitem [ref=e147]: "Binary search, and not just the code: understand why it works."

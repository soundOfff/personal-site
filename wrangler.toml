# Cloudflare Workers configuration. The @astrojs/cloudflare adapter injects
# `main` and the static-assets binding at build time; this file supplies the
# worker name, compatibility settings, and our own bindings.
name = "personal-site"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# Per-IP rate-limit store for the agent endpoint (6 questions/min, one small model).
# In `astro dev`, platformProxy simulates this binding locally — no real id needed.
# The placeholder id below is resolved automatically by the deploy workflow
# (.github/workflows/deploy.yml), which finds or creates the "personal-site-RL"
# namespace and substitutes its real id before building. For a manual deploy:
# `wrangler kv namespace create RL`, then paste the id here.
[[kv_namespaces]]
binding = "RL"
id = "00000000000000000000000000000000"

# The agent's API key is set as an encrypted secret, NOT here:
#   wrangler secret put OPENROUTER_API_KEY
#
# Optional model override (a plain var is fine; it isn't a secret). OpenRouter
# slugs, not first-party model ids:
#   [vars]
#   A2UI_MODEL = "anthropic/claude-sonnet-5"
